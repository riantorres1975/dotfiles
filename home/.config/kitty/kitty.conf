# Fish, one clean terminal surface, and 80% background opacity.
shell /usr/bin/fish
font_family JetBrainsMono Nerd Font Mono
font_size 10.0

hide_window_decorations yes
tab_bar_style hidden
window_border_width 0
window_padding_width 10
background_opacity 0.80

# Preserve the colors of the existing Cristal oscuro terminal profile.
background #1e1e2e
foreground #cdd6f4
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #cdd6f4
